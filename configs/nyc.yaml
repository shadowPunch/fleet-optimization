# NYC TLC study: Manhattan-only Uber (HV0003), January 2024 weekdays.
# Scope and split fixed before any validation was run (TECHNICAL_DOCUMENTATION.md §5.5).
data:
  month: "2024-01"
  operator: HV0003
  borough: Manhattan
  window_start_hour: 12
  window_end_hour: 18
  # Weekdays excluding New Year's Day and MLK Day; first 10 calibrate, last 4 are held out.
  calibration_days: [2, 3, 4, 5, 8, 9, 10, 11, 12, 16]
  held_out_days: [17, 18, 19, 22]
  cache_dir: data/cache

simulation:
  dispatch_interval_seconds: 5.0
  reposition_interval_seconds: 60.0
  mean_patience_seconds: 300.0  # abandonment hazard: structural assumption, not fit
  arrival_bin_minutes: 15
  od_bin_minutes: 60

validation:
  # Pre-registered acceptance thresholds (unchanged since 2026-08-04).
  ks_threshold: 0.10
  cosine_threshold: 0.90
  n_replications: 4
  seed: 0
  # Latent supply calibration grid (calibration days only).
  fleet_sizes: [1500, 2000, 2500, 3000, 3500, 4000, 5000, 6500, 8000, 10000]
  intra_zone_median_seconds: [45, 60, 90, 120, 150, 180, 240, 300]

study:
  seed: 2026
  n_bootstrap: 200  # pre-registered minimum is 40
  n_replications: 5
  tuning_evaluations: 25  # identical budget for every tunable policy
  tuning_seed: 17
  # Tuning constraint: serve >= greedy's fraction of riders minus this.
  service_tolerance: 0.005
  # Wait-time data bounds supply from below only: every fleet of ~4,000+
  # reproduces the calibration days at KS <= 0.10 (TECHNICAL_DOCUMENTATION.md §5.5),
  # so the study spans that data-consistent range instead of one point.
  # Same-zone pickup medians are the calibration-grid optimum at each fleet.
  regimes:
    tight: {fleet_size: 4000, intra_zone_median_seconds: 90}
    mid: {fleet_size: 6500, intra_zone_median_seconds: 120}
    abundant: {fleet_size: 10000, intra_zone_median_seconds: 120}
    # Counterfactual below the data-consistent range: 20% fewer drivers than "tight".
    shortage: {fleet_size: 3200, intra_zone_median_seconds: 90}
  # Greedy dispatch's wait-vs-fleet curve, used to price gains in vehicles.
  fleet_curve_scales: [0.8, 0.9, 1.0, 1.15, 1.3, 1.5, 1.75, 2.0]
  fleet_curve_replications: 3
